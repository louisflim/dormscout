# Optional local overrides (password, etc.) — copy application-local.properties.example
spring.config.import=optional:classpath:application-local.properties

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Database — MySQL (MySQL Workbench / local server)
# 1. In Workbench: CREATE DATABASE IF NOT EXISTS db_dormscout;
# 2. Set credentials: env vars MYSQL_USER / MYSQL_PASSWORD, OR file application-local.properties (see example).
#    MySQL rejects "using password: NO" if root requires a password — you must set one of the above.
spring.datasource.url=jdbc:mysql://localhost:3306/db_dormscout?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate — MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# update: create/update tables from entities; does not drop the database on restart
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 console disabled when using MySQL (enable only if you add H2 for local experiments)
spring.h2.console.enabled=false

# Application Configuration
spring.application.name=dormscout-backend

# Logging
logging.level.root=INFO
logging.level.com.dormscout.backend=DEBUG

# Security
spring.security.user.name=admin
spring.security.user.password=admin

# Force JSON content type
spring.http.encoding.force=true
spring.http.encoding.charset=UTF-8

# Jackson configuration
spring.jackson.serialization.fail-on-empty-beans=false

# Groq API KEY
groq.api.key=${GROQ_API_KEY}